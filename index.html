<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台大獨處空間｜互動地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--ink:#21332d;--muted:#6d7b73;--cream:#f5f2e9;--green:#4f8064;--line:#dce4dc}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
    header{align-items:center;display:flex;justify-content:space-between;margin:auto;max-width:1180px;padding:24px}
    header strong{font-size:15px;letter-spacing:.08em}header a{color:inherit;text-decoration:none}
    main{margin:auto;max-width:1180px;padding:24px}.intro{align-items:end;display:flex;justify-content:space-between;margin-bottom:20px}
    h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,52px);margin:0 0 8px}.intro p,#status{color:var(--muted);margin:0}
    .controls{display:flex;gap:10px;margin-bottom:16px}input,select{background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;padding:11px 12px}input{flex:1;min-width:0}
    #map{background:#dbe8df;border-radius:14px;height:min(68vh,680px);min-height:430px;overflow:hidden}
    .popup h2{font-size:17px;margin:0 0 7px}.popup p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.popup small{color:var(--green);display:block;margin-top:8px}.score{color:var(--green);font-size:15px;font-weight:700;margin:8px 0}
    .notice{background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin-top:14px;padding:12px 14px}
    @media(max-width:600px){header,main{padding-left:16px;padding-right:16px}header{align-items:flex-start;flex-direction:column;gap:12px}.intro{align-items:flex-start;flex-direction:column;gap:8px}.controls{flex-direction:column}#map{min-height:520px}}
  </style>
</head>
<body>
  <header><a href="index.html"><strong>台大獨處空間互動地圖</strong></a></header>
  <main>
    <section class="intro"><div><h1>找到一個安靜角落</h1><p>資料來自公開 Google 試算表，更新後會自動同步。</p></div><p id="status">資料載入中...</p></section>
    <div class="controls"><input id="search" type="search" placeholder="搜尋地點名稱或推薦理由"><select id="refresh"><option value="60000">每 1 分鐘更新</option><option value="300000">每 5 分鐘更新</option><option value="0">不自動更新</option></select></div>
    <div id="map" aria-label="台大獨處空間互動地圖"></div>
    <div class="notice">資料更新後，地圖會依照更新頻率自動重新載入；也可以重新整理頁面立即取得最新資料。</div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vT7xqBlw3mzQXBNhrb4TkEWcmd6438qQctRKlqDWd0FQ0kPI9UvboTO52SLGStvvsgR9i80PVuUodjL/pub?output=csv";
    const map=L.map("map").setView([25.0173,121.5397],16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
    const markers=L.layerGroup().addTo(map),search=document.getElementById("search"),status=document.getElementById("status");let places=[],timer;
    function parseCsv(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i+=1){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i+=1}else if(c==='"')quoted=!quoted;else if(c===","&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i+=1;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
    function normalise(rows){if(rows.length<2)return[];const h=rows[0].map(v=>v.trim().toLowerCase()),find=(names,fallback)=>{const i=h.findIndex(x=>names.some(n=>x.includes(n)));return i<0?fallback:i},ni=find(["名稱","name","地點"],0),xi=find(["經度","longitude","lng","lon"],1),yi=find(["緯度","latitude","lat"],2),ri=find(["理由","reason","描述"],3),si=find(["評分","rating","score"],4);return rows.slice(1).map(r=>({name:(r[ni]||"").trim(),lng:Number.parseFloat(r[xi]),lat:Number.parseFloat(r[yi]),reason:(r[ri]||"").trim(),rating:Number.parseFloat(r[si])})).filter(p=>p.name&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Number.isFinite(p.rating)&&p.rating>=0&&p.rating<=100)}
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    function render(){markers.clearLayers();const q=search.value.trim().toLowerCase(),visible=places.filter(p=>`${p.name} ${p.reason}`.toLowerCase().includes(q)),bounds=[];visible.forEach(p=>{L.marker([p.lat,p.lng]).bindPopup(`<div class="popup"><h2>${esc(p.name)}</h2><div class="score">人工評分：${p.rating}/100</div><p>${esc(p.reason||"尚未填寫推薦理由")}</p><small>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</small></div>`).addTo(markers);bounds.push([p.lat,p.lng])});if(bounds.length&&!q)map.fitBounds(bounds,{padding:[30,30],maxZoom:17});status.textContent=`顯示 ${visible.length} 個已審核空間 · 最後更新 ${new Date().toLocaleTimeString("zh-TW")}`}
    async function load(){status.textContent="資料更新中...";try{const r=await fetch(`${CSV_URL}&t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw Error(r.status);places=normalise(parseCsv(await r.text()));render()}catch(e){status.textContent="資料載入失敗，請確認試算表已公開發佈。";console.error(e)}}
    function schedule(){clearInterval(timer);const ms=Number(document.getElementById("refresh").value);if(ms)timer=setInterval(load,ms)}
    search.addEventListener("input",render);document.getElementById("refresh").addEventListener("change",schedule);load();schedule();
  </script>
</body>
</html>
