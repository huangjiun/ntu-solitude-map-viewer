<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="探索台大校園裡適合一個人安靜停留的角落。">
  <title>一個人的台大｜獨處空間地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--ink:#20352c;--muted:#758278;--cream:#f3f0e7;--paper:#fffdf8;--green:#587b68;--deep:#315744;--rust:#cc7657;--gold:#e4b45c;--line:#e1e6de;--shadow:0 20px 60px #20352c14}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:"Noto Sans TC",system-ui,sans-serif}
    header{align-items:center;display:flex;justify-content:space-between;margin:auto;max-width:1280px;padding:27px 34px 18px}
    .brand{align-items:center;color:inherit;display:flex;gap:12px;text-decoration:none}.mark{align-items:center;background:var(--ink);border-radius:50%;color:#fff;height:37px;display:flex;font-family:serif;font-size:17px;justify-content:center;width:37px}.brand strong,.brand small{display:block}.brand strong{font-size:14px;letter-spacing:.1em}.brand small{color:var(--muted);font-size:10px;margin-top:2px}
    header nav{display:flex;gap:22px;font-size:12px}header nav a{color:var(--muted);text-decoration:none}header nav a.active{color:var(--ink);font-weight:700}
    main{margin:auto;max-width:1280px;padding:38px 34px 60px}.hero{align-items:end;display:flex;justify-content:space-between;margin-bottom:28px}.eyebrow{color:var(--rust);font-size:10px;font-weight:800;letter-spacing:.22em;margin:0 0 12px}.hero h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(42px,6vw,74px);letter-spacing:-.05em;line-height:1.04;margin:0}.hero h1 em{color:var(--green);font-style:normal}.hero-copy>p:last-child{color:var(--muted);font-size:13px;line-height:1.8;margin:18px 0 0}.stats{display:flex;gap:25px;margin-bottom:4px}.stat{border-left:1px solid var(--line);padding-left:13px}.stat strong{display:block;font-family:"Playfair Display",serif;font-size:25px}.stat span{color:var(--muted);font-size:10px}
    .workspace{background:var(--paper);border:1px solid #e8ebe4;border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:320px 1fr;min-height:650px;overflow:hidden}.sidebar{background:#fbfaf4;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:23px}.side-top{align-items:center;display:flex;justify-content:space-between}.side-top h2{font-family:"Playfair Display",serif;font-size:24px;margin:0}.count{background:#e5eee7;border-radius:99px;color:var(--deep);font-size:11px;padding:5px 9px}.search{background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:12px;margin:22px 0 10px;padding:12px 13px;width:100%}.search:focus{border-color:var(--green);outline:2px solid #587b6820}.side-note{color:var(--muted);font-size:10px;line-height:1.6;margin:0 0 12px}.list{overflow:auto;padding-right:3px}.place-card{background:#fff;border:1px solid var(--line);border-radius:11px;cursor:pointer;margin:9px 0;padding:13px;transition:.2s}.place-card:hover,.place-card.selected{border-color:#9bb6a3;box-shadow:0 7px 20px #31574412;transform:translateY(-1px)}.place-card h3{font-family:"Playfair Display",serif;font-size:17px;margin:0 0 7px}.place-card p{color:var(--muted);display:-webkit-box;font-size:11px;line-height:1.6;margin:0;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}.card-bottom{align-items:center;display:flex;justify-content:space-between;margin-top:11px}.rating{align-items:center;background:#fff5da;border-radius:99px;color:#9b6b18;display:inline-flex;font-size:11px;font-weight:800;gap:3px;padding:5px 8px}.rating::before{content:"★";font-size:10px}.coords{color:#a1aaa3;font-size:9px}
    .map-wrap{min-width:0;position:relative}.map-tools{align-items:center;display:flex;gap:9px;left:20px;position:absolute;right:20px;top:20px;z-index:500}.map-label{background:#ffffffeb;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px;padding:9px 13px}.refresh{background:var(--ink);border:0;border-radius:99px;color:#fff;cursor:pointer;font:inherit;font-size:11px;padding:9px 13px}.refresh:hover{background:var(--deep)}#map{height:650px;width:100%}.leaflet-control-zoom{border:0!important;box-shadow:0 5px 20px #20352c18!important}.leaflet-control-zoom a{color:var(--ink)!important}
    .popup{min-width:190px}.popup h2{font-family:"Playfair Display",serif;font-size:19px;margin:0 0 7px}.popup p{color:var(--muted);font-size:12px;line-height:1.7;margin:8px 0}.popup small{color:var(--green);font-size:10px}.popup-score{color:#a16e1c;font-size:13px;font-weight:800}.empty{color:var(--muted);font-size:12px;line-height:1.7;padding:20px 3px}.footer-note{color:var(--muted);font-size:10px;margin:17px 0 0;text-align:right}
    @media(max-width:850px){header{padding-left:20px;padding-right:20px}main{padding:28px 20px 42px}.hero{align-items:flex-start;flex-direction:column;gap:23px}.stats{margin:0}.workspace{grid-template-columns:1fr}.sidebar{border-bottom:1px solid var(--line);border-right:0;max-height:390px}.list{display:grid;gap:0 9px;grid-template-columns:repeat(2,1fr)}.place-card{margin:5px 0}.map-wrap,#map{height:530px}}
    @media(max-width:520px){header{align-items:flex-start;flex-direction:column;gap:15px}header nav{gap:15px}.hero h1{font-size:48px}.stats{gap:16px}.workspace{border-radius:14px}.sidebar{padding:18px}.list{display:block}.sidebar{max-height:440px}.map-tools{left:12px;right:12px;top:12px}#map{height:470px}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html"><span class="mark">一</span><span><strong>一個人的台大</strong><small>獨處空間地圖</small></span></a>
    <nav><a class="active" href="index.html">探索地圖</a><a href="https://huangjiun.github.io/ntu-solitude-map/">分享空間</a></nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-copy"><p class="eyebrow">NTU · ALONE TOGETHER</p><h1>留一個角落，<br><em>給自己。</em></h1><p>有些地方不需要和誰說話，<br>只要坐下來，就能慢慢找回自己的節奏。</p></div>
      <div class="stats"><div class="stat"><strong id="total">—</strong><span>已審核空間</span></div><div class="stat"><strong id="average">—</strong><span>平均評分</span></div></div>
    </section>
    <section class="workspace">
      <aside class="sidebar">
        <div class="side-top"><h2>探索角落</h2><span class="count" id="count">載入中</span></div>
        <input class="search" id="search" type="search" placeholder="搜尋名稱或推薦理由">
        <p class="side-note" id="status">正在讀取最新資料...</p>
        <div class="list" id="list"></div>
      </aside>
      <div class="map-wrap">
        <div class="map-tools"><span class="map-label">點擊標記查看詳情</span><button class="refresh" id="refreshButton">↻ 更新資料</button></div>
        <div id="map" aria-label="台大獨處空間互動地圖"></div>
      </div>
    </section>
    <p class="footer-note">資料來自公開 Google 試算表 · 評分由人工審核後填入</p>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vT7xqBlw3mzQXBNhrb4TkEWcmd6438qQctRKlqDWd0FQ0kPI9UvboTO52SLGStvvsgR9i80PVuUodjL/pub?output=csv";
    const map=L.map("map").setView([25.0173,121.5397],16);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
    const markers=L.layerGroup().addTo(map),search=document.getElementById("search"),list=document.getElementById("list"),status=document.getElementById("status");let places=[],selected=null;
    function parseCsv(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i+=1){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i+=1}else if(c==='"')quoted=!quoted;else if(c===","&&!quoted){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i+=1;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
    function normalise(rows){if(rows.length<2)return[];const h=rows[0].map(v=>v.trim().toLowerCase()),find=(names,fallback)=>{const i=h.findIndex(x=>names.some(n=>x.includes(n)));return i<0?fallback:i},ni=find(["名稱","name","地點"],0),xi=find(["經度","longitude","lng","lon"],1),yi=find(["緯度","latitude","lat"],2),ri=find(["理由","reason","描述"],3),si=find(["評分","rating","score"],4);return rows.slice(1).map((r,index)=>({id:index,name:(r[ni]||"").trim(),lng:Number.parseFloat(r[xi]),lat:Number.parseFloat(r[yi]),reason:(r[ri]||"").trim(),rating:Number.parseFloat(r[si])})).filter(p=>p.name&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Number.isFinite(p.rating)&&p.rating>=0&&p.rating<=10)}
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    function popup(p){return `<div class="popup"><h2>${esc(p.name)}</h2><div class="popup-score">★ ${p.rating.toFixed(1)} / 10</div><p>${esc(p.reason||"尚未填寫推薦理由")}</p><small>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</small></div>`}
    function focusPlace(p){selected=p.id;map.setView([p.lat,p.lng],18,{animate:true});markers.eachLayer(marker=>{if(marker.placeId===p.id)marker.openPopup()});renderList()}
    function renderList(){const q=search.value.trim().toLowerCase(),visible=places.filter(p=>`${p.name} ${p.reason}`.toLowerCase().includes(q));list.innerHTML=visible.length?visible.map(p=>`<article class="place-card ${selected===p.id?"selected":""}" data-id="${p.id}"><h3>${esc(p.name)}</h3><p>${esc(p.reason||"尚未填寫推薦理由")}</p><div class="card-bottom"><span class="rating">${p.rating.toFixed(1)} / 10</span><span class="coords">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span></div></article>`).join(""):`<p class="empty">找不到符合的空間。<br>試著換個關鍵字看看。</p>`;list.querySelectorAll(".place-card").forEach(card=>card.addEventListener("click",()=>focusPlace(places.find(p=>p.id===Number(card.dataset.id)))));document.getElementById("count").textContent=`${visible.length} 個`}
    function render(){markers.clearLayers();const q=search.value.trim().toLowerCase(),visible=places.filter(p=>`${p.name} ${p.reason}`.toLowerCase().includes(q)),bounds=[];visible.forEach(p=>{const marker=L.marker([p.lat,p.lng]).bindPopup(popup(p)).addTo(markers);marker.placeId=p.id;marker.on("click",()=>{selected=p.id;renderList()});bounds.push([p.lat,p.lng])});if(bounds.length&&!q&&!selected)map.fitBounds(bounds,{padding:[45,45],maxZoom:17});renderList();document.getElementById("total").textContent=places.length;document.getElementById("average").textContent=places.length?(places.reduce((sum,p)=>sum+p.rating,0)/places.length).toFixed(1):"—";status.textContent=`最後更新 ${new Date().toLocaleTimeString("zh-TW")} · 空白評分的投稿不會顯示`}
    async function load(){status.textContent="資料更新中...";try{const r=await fetch(`${CSV_URL}&t=${Date.now()}`,{cache:"no-store"});if(!r.ok)throw Error(r.status);places=normalise(parseCsv(await r.text()));selected=null;render()}catch(e){status.textContent="資料載入失敗，請確認試算表已公開發佈。";console.error(e)}}
    search.addEventListener("input",()=>{selected=null;render()});document.getElementById("refreshButton").addEventListener("click",load);load();setInterval(load,300000);
  </script>
</body>
</html>
